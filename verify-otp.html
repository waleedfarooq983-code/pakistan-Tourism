<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP — Discover Pakistan</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
    .auth-page {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
    }
    .auth-visual {
        background: linear-gradient(135deg, var(--green-900), var(--green-700)),
                    url('https://images.unsplash.com/photo-1589553416260-f586c8f1514f?w=1200&q=80');
        background-size: cover;
        background-position: center;
        background-blend-mode: multiply;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 50px;
        position: relative;
    }
    .auth-visual h1 {
        font-family: var(--font-display);
        font-size: 2.6rem;
        color: white;
        line-height: 1.15;
        margin-bottom: 16px;
    }
    .auth-visual p { color: rgba(255,255,255,.85); font-size: 1.05rem; max-width: 460px; }
    .auth-visual .brand { display: flex; align-items: center; gap: 12px; font-size: 1.2rem; font-weight: 700; color: white; }
    .auth-visual .brand i { color: var(--gold-300); font-size: 1.6rem; }

    .auth-form-wrap {
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 30px;
    }
    .auth-form-inner { width: 100%; max-width: 420px; }
    .auth-form-inner h2 { font-size: 2rem; color: var(--green-900); margin-bottom: 6px; }
    .auth-form-inner .sub { color: var(--ink-500); margin-bottom: 26px; }

    .back-home {
        position: absolute; top: 24px; left: 30px;
        color: white; font-weight: 600; font-size: .9rem;
        background: rgba(255,255,255,.15);
        padding: 10px 18px; border-radius: var(--radius-pill);
        backdrop-filter: blur(8px); transition: .25s;
        text-decoration: none;
    }
    .back-home:hover { background: rgba(255,255,255,.25); transform: translateX(-3px); }

    .field-wrap { margin-bottom: 18px; position: relative; }
    .field-wrap label {
        display: block;
        font-size: .82rem;
        font-weight: 700;
        color: var(--ink-700);
        text-transform: uppercase;
        letter-spacing: .5px;
        margin-bottom: 6px;
    }
    .field-wrap input {
        width: 100%;
        padding: 13px 16px;
        border-radius: var(--radius-sm);
        border: 2px solid var(--ink-100);
        font-size: .95rem;
        outline: none;
        transition: .2s;
        background: var(--bg);
        color: var(--ink-900);
    }
    .field-wrap input:focus {
        border-color: var(--green-500);
        background: white;
        box-shadow: 0 0 0 4px rgba(18, 137, 74, .1);
    }
    .otp-code-input {
        text-align: center;
        font-size: 1.8rem !important;
        letter-spacing: 12px;
        font-weight: 700;
        padding: 14px 16px !important;
    }

    .auth-btn {
        width: 100%;
        padding: 14px;
        border-radius: var(--radius-pill);
        background: var(--green-700);
        color: white;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        transition: .25s;
        margin-top: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .auth-btn:hover { background: var(--green-900); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(10,107,58,.3); }
    .auth-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .auth-switch {
        text-align: center;
        color: var(--ink-500);
        font-size: .92rem;
        margin-top: 24px;
    }
    .auth-switch a {
        color: var(--green-700);
        font-weight: 700;
        text-decoration: none;
    }
    .auth-switch a:hover { text-decoration: underline; }

    .resend-box {
        text-align: center;
        margin-top: 18px;
        font-size: .9rem;
        color: var(--ink-600);
    }
    .resend-box a {
        color: var(--green-700);
        font-weight: 600;
        cursor: pointer;
        text-decoration: underline;
    }

    @media (max-width: 860px) {
        .auth-page { grid-template-columns: 1fr; }
        .auth-visual { display: none; }
    }
</style>
</head>
<body>

<div class="auth-page">
    <div class="auth-visual">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div></div>
        <div>
            <div class="brand" style="margin-bottom:20px;">
                <i class="fas fa-shield-alt"></i> Account Security
            </div>
            <h1>Verify your email address.</h1>
            <p>Please enter the 6-digit one-time verification passcode sent to your registered email to continue.</p>
        </div>
    </div>

    <div class="auth-form-wrap">
        <div class="auth-form-inner">
            <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green-50),#d4eddd);color:var(--green-700);display:flex;align-items:center;justify-content:center;margin-bottom:18px;font-size:1.8rem;">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h2>Verify Code</h2>
            <p class="sub">Enter the 6-digit OTP code sent to your email</p>

            <form id="verifyOtpForm" onsubmit="return handleVerifyOtp(event)">
                <div class="field-wrap">
                    <label>Email Address</label>
                    <input type="email" id="otpEmail" placeholder="you@example.com" required>
                </div>

                <div class="field-wrap">
                    <label>6-Digit Verification Code</label>
                    <input type="text" id="otpCode" class="otp-code-input" maxlength="6" inputmode="numeric" placeholder="• • • • • •" required autofocus>
                </div>

                <div id="otpError" style="color:#c0392b;font-size:.88rem;margin-bottom:12px;min-height:18px;"></div>

                <button type="submit" class="auth-btn" id="verifyBtn">
                    <i class="fas fa-check-circle"></i> Verify Code
                </button>
            </form>

            <div class="resend-box">
                Didn't receive the email?
                <a onclick="handleResendOtp()">Resend Code</a>
                <div id="countdown" style="margin-top:6px;font-size:.82rem;color:var(--ink-400);"></div>
            </div>

            <div class="auth-switch">
                Back to <a href="signup.html">Sign Up</a> or <a href="login.html">Login</a>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const emailField = document.getElementById('otpEmail');
const codeField = document.getElementById('otpCode');
const errEl = document.getElementById('otpError');
const verifyBtn = document.getElementById('verifyBtn');

const initialEmail = urlParams.get('email') || sessionStorage.getItem('pendingOtpEmail') || '';
if (initialEmail) {
    emailField.value = initialEmail;
}

codeField.addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
    if (e.target.value.length === 6) {
        setTimeout(handleVerifyOtp, 150);
    }
});

let timerSeconds = 300;
let timerInterval = setInterval(() => {
    timerSeconds--;
    const cd = document.getElementById('countdown');
    if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        cd.textContent = 'Code expired. Please click Resend.';
        cd.style.color = '#c0392b';
    } else {
        const m = Math.floor(timerSeconds / 60);
        const s = (timerSeconds % 60).toString().padStart(2, '0');
        cd.textContent = `Code expires in ${m}:${s}`;
        cd.style.color = 'var(--ink-400)';
    }
}, 1000);

async function handleVerifyOtp(e) {
    if (e && e.preventDefault) e.preventDefault();
    errEl.textContent = '';
    const email = emailField.value.trim().toLowerCase();
    const code = codeField.value.trim();

    if (!email) { errEl.textContent = 'Please enter your email.'; return; }
    if (code.length !== 6) { errEl.textContent = 'Please enter all 6 digits.'; return; }

    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

    try {
        const meta = {
            name: sessionStorage.getItem('pendingOtpName') || '',
            phone: sessionStorage.getItem('pendingOtpPhone') || '',
            password: sessionStorage.getItem('pendingOtpPassword') || ''
        };

        const res = await API.auth.verifyOtp(email, code, 'signup', meta);
        showToast('Account verified successfully! 🎉', 'success');
        setTimeout(() => {
            location.href = 'dashboard.html';
        }, 800);
    } catch (err) {
        errEl.textContent = err.message || 'Verification failed. Please check the code.';
        verifyBtn.disabled = false;
        verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Verify Code';
        codeField.value = '';
        codeField.focus();
    }
}

async function handleResendOtp() {
    const email = emailField.value.trim().toLowerCase();
    if (!email) {
        errEl.textContent = 'Please provide your email to resend code.';
        return;
    }
    try {
        errEl.textContent = '';
        await API.auth.resendOtp(email, 'signup');
        showToast('A new verification code has been dispatched! 📧', 'info');
        timerSeconds = 300;
    } catch (err) {
        errEl.textContent = err.message || 'Failed to resend code.';
    }
}
</script>
</body>
</html>
